name: CI

# Bramka jakosci. Wdrozenie na produkcje jest automatyczne, wiec to jest miejsce,
# w ktorym zly kod ma zostac zatrzymany.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call: # wywolywane przez deploy.yml przed wdrozeniem

permissions:
  contents: read

jobs:
  test:
    name: Testy i kontrole
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SD_OFFLINE: '1' # zero ruchu do zrodel rynkowych w CI

    steps:
      - uses: actions/checkout@v5

      # Wersja akcji (node24) nie ma nic wspolnego z wersja Node, ktora testujemy.
      # Akcja to narzedzie runnera; ponizsze 'node-version' decyduje o tym, czym
      # uruchamiamy aplikacje - i to musi zostac na 22, bo taka stoi na maszynie.
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # CELOWO jedno polecenie zamiast rozpisanych krokow: dokladnie to samo uruchamia
      # sie lokalnie przez 'bash scripts/check.sh'. Gdy kontrole byly opisane osobno
      # w tym pliku, rozjechaly sie ze sposobem, w jaki uruchamialem je u siebie -
      # testy przechodzily lokalnie i padaly tutaj, bo CI ustawia SD_OFFLINE=1.
      - name: Komplet kontroli (scripts/check.sh)
        run: bash scripts/check.sh
