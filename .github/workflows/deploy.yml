name: Deploy

# Merge do main jedzie na produkcje automatycznie, ale nie na skroty:
# testy -> staging na sanityzowanej kopii produkcji -> produkcja z proba generalna
# migracji i automatycznym rollbackiem.
on:
  push:
    branches: [main]
  workflow_dispatch: # mozliwosc recznego uruchomienia z zakladki Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false # nigdy nie przerywamy trwajacego wdrozenia w polowie

permissions:
  contents: read
  id-token: write # wymagane przez Workload Identity Federation

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Staging, potem produkcja
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # Jeden zestaw flag dla WSZYSTKICH wywolan ssh. Wczesniej czesc krokow go nie miala
    # i mogla zawisnac na pytaniu o klucz hosta, ktorego nikt nie zobaczy.
    # Zapis -oNazwa=wartosc (bez spacji) przezywa podzial slow w powloce.
    env:
      SSH_FLAGS: >-
        --ssh-flag=-oStrictHostKeyChecking=no
        --ssh-flag=-oUserKnownHostsFile=/dev/null
        --ssh-flag=-oBatchMode=yes
        --ssh-flag=-oConnectTimeout=20
        --ssh-flag=-oServerAliveInterval=15
        --ssh-flag=-oServerAliveCountMax=4

    steps:
      - uses: actions/checkout@v5

      # Krotkozyjacy token zamiast klucza konta uslugowego - w repozytorium nie lezy zaden sekret GCP.
      # UWAGA przy aktualizacjach: NIE dodawaj tu parametru 'audience'. Od v3 akcja wylicza go
      # sama z nazwy dostawcy, a jawna wartosc przepisana ze starszego poradnika psuje logowanie.
      - name: Uwierzytelnienie w Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Paczka wydania
        run: |
          # Prawa wyrownane w archiwum - inaczej katalog projektu z prawami 700
          # zablokowalby usluge na serwerze.
          tar -czf /tmp/stock-dashboard.tar.gz \
            --exclude='./.git' --exclude='./.github' --exclude='./data' \
            --exclude='./.env' --exclude='./node_modules' \
            --mode='u+rwX,go=rX' \
            --transform='s,^\.,stock-dashboard,' .
          ls -lh /tmp/stock-dashboard.tar.gz

      # OS Login potrzebuje chwili na rozpropagowanie klucza konta uslugowego przy
      # pierwszym polaczeniu. Sonda z krotkim limitem daje czytelny blad zamiast zawieszenia.
      - name: Sprawdzenie polaczenia z maszyna
        timeout-minutes: 5
        run: |
          for i in $(seq 1 6); do
            if timeout 45 gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
                 --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
                 $SSH_FLAGS --command="echo polaczenie-ok"; then
              echo "Polaczenie dziala (proba $i)"
              exit 0
            fi
            echo "Proba $i nieudana, czekam 15 s (klucz OS Login moze sie jeszcze propagowac)..."
            sleep 15
          done
          echo "Nie udalo sie polaczyc z maszyna przez IAP."
          echo "Sprawdz: reguly firewalla dla 35.235.240.0/20 oraz role konta uslugowego."
          exit 1

      # NIE uzywamy 'gcloud compute scp'. Od OpenSSH 9.0 scp przesyla dane podsystemem
      # SFTP, a ten w polaczeniu z tunelem IAP potrafi zawisnac na glucho - runner ma
      # OpenSSH 9.6, wiec trafia dokladnie w ten przypadek (obserwowane: kod 124 z timeout
      # przy paczce 164 kB, czyli na pewno nie przepustowosc).
      #
      # Sonda powyzej udowodnila, ze 'ssh --command' dziala. Wysylamy wiec plik ta sama
      # droga - strumieniem na standardowe wejscie. Flaga -T wylacza pseudoterminal;
      # bez niej terminal przerobilby konce linii i paczka dotarlaby uszkodzona.
      - name: Wyslanie na maszyne
        timeout-minutes: 8
        run: |
          set -euo pipefail
          ROZMIAR=$(stat -c%s /tmp/stock-dashboard.tar.gz)
          SUMA_LOKALNA=$(sha256sum /tmp/stock-dashboard.tar.gz | cut -d' ' -f1)
          echo "Paczka: $ROZMIAR B, sha256 ${SUMA_LOKALNA:0:16}..."

          START=$(date +%s)
          timeout 360 gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            $SSH_FLAGS --ssh-flag=-T \
            --command='cat > ~/release.tar.gz' < /tmp/stock-dashboard.tar.gz
          echo "Przeslano w $(( $(date +%s) - START )) s"

          # Bez tego sprawdzenia uszkodzona paczka wyszlaby na jaw dopiero przy
          # rozpakowaniu na maszynie - juz po zatrzymaniu uslugi.
          SUMA_ZDALNA=$(timeout 60 gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            $SSH_FLAGS --command='sha256sum ~/release.tar.gz' 2>/dev/null \
            | tr -d '\r' | grep -oE '[0-9a-f]{64}' | head -1)

          if [ "$SUMA_LOKALNA" != "$SUMA_ZDALNA" ]; then
            echo "Paczka dotarla uszkodzona."
            echo "  lokalnie: $SUMA_LOKALNA"
            echo "  na maszynie: ${SUMA_ZDALNA:-brak odpowiedzi}"
            exit 1
          fi
          echo "Suma kontrolna na maszynie zgadza sie z lokalna."

      # Staging dostaje sanityzowana kopie produkcji: prawdziwy ksztalt danych,
      # zadnych dzialajacych poswiadczen.
      # release.sh bierzemy Z PACZKI, a nie z /opt - inaczej nowe wydanie byloby
      # instalowane skryptem ze starej wersji.
      - name: Wydanie na staging
        timeout-minutes: 6
        run: |
          timeout 330 gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            $SSH_FLAGS \
            --command 'set -e; W=$(mktemp -d); tar -xzf ~/release.tar.gz -C "$W"; sudo bash "$W/stock-dashboard/deploy/gcp/release.sh" ~/release.tar.gz staging; rm -rf "$W"'

      - name: Smoke test stagingu
        timeout-minutes: 3
        run: |
          timeout 160 gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            $SSH_FLAGS \
            --command '
              set -e
              curl -fsS http://127.0.0.1:8788/stock-dashboard/api/v1/health | grep -q "\"ok\":true"
              curl -fsS -o /dev/null -w "login.html %{http_code}\n" http://127.0.0.1:8788/stock-dashboard/login.html
              echo "Staging odpowiada poprawnie"
            '

      # Produkcja: release.sh sam robi kopie zapasowa, probe generalna migracji
      # i cofa sie do poprzedniej wersji, jesli health check nie przejdzie.
      - name: Wydanie na produkcje
        timeout-minutes: 6
        run: |
          timeout 330 gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            $SSH_FLAGS \
            --command 'set -e; W=$(mktemp -d); tar -xzf ~/release.tar.gz -C "$W"; sudo bash "$W/stock-dashboard/deploy/gcp/release.sh" ~/release.tar.gz production; rm -rf "$W"'

      - name: Weryfikacja publiczna
        run: |
          HOST="${{ vars.PUBLIC_HOST }}"
          if [ -z "$HOST" ]; then
            echo "Zmienna PUBLIC_HOST nieustawiona - pomijam sprawdzenie z internetu."
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://$HOST/stock-dashboard/api/v1/health" | grep -q '"ok":true'; then
              echo "Produkcja odpowiada publicznie: https://$HOST/stock-dashboard/"
              exit 0
            fi
            sleep 6
          done
          echo "Serwis nie odpowiedzial publicznie. Aplikacja moze dzialac, a problem lezec w Caddy."
          exit 1

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### Wydanie ${{ github.sha }}"
            echo ""
            echo "- staging: sanityzowana kopia produkcji, port 8788 (tylko petla zwrotna)"
            echo "- produkcja: kopia zapasowa + proba generalna migracji + health check"
            echo "- cofniecie: \`sudo rsync -a --delete /opt/stock-dashboard.old/ /opt/stock-dashboard/ && sudo systemctl restart stock-dashboard\`"
          } >> "$GITHUB_STEP_SUMMARY"
