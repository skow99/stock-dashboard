<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="share.pageTitle">Portfel - widok tylko do odczytu</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css?v=20260822b" />
  <script type="module" src="./share.js?v=20260822b"></script>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">
      <h1 id="title" data-i18n="share.title">Widok tylko do odczytu</h1>
      <span class="sub" id="as-of" data-i18n="app.loading">Ladowanie...</span>
    </div>
    <span class="spacer"></span>
    <span id="lang-switch"></span>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <section class="cards" id="cards"></section>

  <section class="panel" id="panel-chart">
    <header><h2 data-i18n="section.portfolioValue">Wartosc portfela</h2></header>
    <div class="chart-meta" id="meta-value"></div>
    <div class="chart" id="chart-value"></div>
  </section>

  <section class="panel" id="panel-portfolios">
    <header><h2 data-i18n="share.portfolios">Portfele</h2></header>
    <div id="portfolios"></div>
  </section>

  <section class="panel">
    <header><h2 data-i18n="section.sectors">Ekspozycja sektorowa</h2></header>
    <div id="sectors"></div>
  </section>

  <section class="panel">
    <header><h2 data-i18n="section.positions">Pozycje</h2></header>
    <div class="table-scroll">
      <table id="tbl-positions">
        <thead><tr>
          <th class="left static" data-i18n="col.company">Spolka</th>
          <th class="static" data-i18n="col.value">Wartosc</th>
          <th class="static" data-i18n="col.changePct">Zmiana %</th>
          <th class="static" data-i18n="col.result">Wynik</th>
          <th class="static" data-i18n="col.share">Udzial</th>
          <th class="left static" data-i18n="col.sector">Sektor</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<div id="toasts"></div>
</body>
</html>
